[package]
name = "lt-tauri"
version = "0.2.17"
edition = "2021"
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
image = "0.25.10"
sys-locale = { workspace = true }
lt-core = { path = "../lt-core" }
lt-audio = { path = "../lt-audio" }
lt-stt = { path = "../lt-stt" }
lt-llm = { path = "../lt-llm" }
lt-output = { path = "../lt-output" }
lt-pipeline = { path = "../lt-pipeline" }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"

