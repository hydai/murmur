"$schema" = "../gen/schemas/desktop-schema.json"

# One permission set per window. The overlay is always on screen and only ever
# starts a recording or opens settings; it has no business reading the config,
# writing an API key or clearing history, so it cannot.

[[permission]]
identifier = "overlay-commands"
description = "What the always-on recording overlay needs"
commands.allow = [
    "toggle_recording",
    "open_settings_window",
]

[[permission]]
identifier = "settings-commands"
description = "Reading and writing every configurable setting"
commands.allow = [
    "get_config",
    "get_stt_providers",
    "set_stt_provider",
    "save_api_key",
    "get_llm_processors",
    "set_llm_processor",
    "set_llm_model",
    "set_custom_llm_endpoint",
    "set_custom_stt_endpoint",
    "set_output_mode",
    "set_save_history",
    "set_chinese_conversion",
    "set_hotkey",
    "get_dictionary",
    "add_dictionary_entry",
    "update_dictionary_entry",
    "delete_dictionary_entry",
    "get_prompts",
    "set_prompt",
    "reset_prompt",
    "get_diagnostic_logs",
    "clear_diagnostic_logs",
    "get_apple_stt_locales",
    "set_apple_stt_locale",
    "download_apple_stt_model",
    "get_elevenlabs_languages",
    "set_elevenlabs_language",
]

[[permission]]
identifier = "history-commands"
description = "Reading and pruning the transcription history"
commands.allow = [
    "get_history",
    "search_history",
    "delete_history_entry",
    "clear_history",
]
