"$schema" = "../gen/schemas/desktop-schema.json"

# Permission sets group commands by job, and each window's capability lists the
# sets it needs. The recording capsule (the `main` window) calls no commands.
# `start_pipeline`, `stop_pipeline`, `toggle_recording` and
# `open_settings_window` stay registered, but no window is granted them: the
# shortcut and the menu bar run the same code in Rust (`toggle_and_report`,
# and `open_settings_window` itself).

[[permission]]
identifier = "settings-commands"
description = "Reading and writing every configurable setting"
commands.allow = [
    "get_config",
    "get_stt_providers",
    "set_stt_provider",
    "save_api_key",
    "get_llm_processors",
    "set_llm_processor",
    "set_llm_model",
    "set_custom_llm_endpoint",
    "set_custom_stt_endpoint",
    "set_output_mode",
    "set_save_history",
    "set_show_recording_indicator",
    "set_chinese_conversion",
    "set_hotkey",
    "get_dictionary",
    "add_dictionary_entry",
    "update_dictionary_entry",
    "delete_dictionary_entry",
    "get_prompts",
    "set_prompt",
    "reset_prompt",
    "get_diagnostic_logs",
    "clear_diagnostic_logs",
    "get_apple_stt_locales",
    "set_apple_stt_locale",
    "download_apple_stt_model",
    "get_elevenlabs_languages",
    "set_elevenlabs_language",
]

[[permission]]
identifier = "history-commands"
description = "Reading and pruning the transcription history"
commands.allow = [
    "get_history",
    "search_history",
    "delete_history_entry",
    "clear_history",
]
