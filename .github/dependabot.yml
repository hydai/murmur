version: 2

# One multi-ecosystem group means one scheduled pull request covering Cargo,
# npm, and GitHub Actions together, instead of one PR per group plus one per
# ungrouped dependency (the 2026-09-28 run opened eight). It also keeps the
# Rust crate and npm package of a Tauri plugin release in the same PR.
# Every `updates` entry must declare `patterns` to join the group; `ignore`
# rules stay per ecosystem.
multi-ecosystem-groups:
  deps:
    schedule:
      interval: weekly
      day: monday

updates:
  # Cargo (Rust workspace)
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: deps

  # npm (Svelte 5 frontend)
  - package-ecosystem: npm
    directory: /ui
    patterns: ["*"]
    multi-ecosystem-group: deps
    ignore:
      # @tauri-apps/api must match the Rust `tauri` crate's major/minor
      # version (enforced by tauri-cli at build time). Allow patch bumps
      # only — major/minor bumps must be coordinated with the Rust-side
      # `tauri` bump by hand (e.g. `npm install @tauri-apps/api@<v>`
      # in /ui after merging it).
      - dependency-name: "@tauri-apps/api"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # svelte-check declares `typescript: ^5.0.0 || ^6.0.0` as a peer
      # dependency, so a typescript 7 bump makes `npm ci` fail with
      # ERESOLVE (see #96/#97). Allow minor/patch bumps only until
      # svelte-check supports TypeScript 7.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: deps
