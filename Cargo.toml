[workspace]
members = [
    "crates/lt-core",
    "crates/lt-audio",
    "crates/lt-stt",
    "crates/lt-llm",
    "crates/lt-output",
    "crates/lt-pipeline",
    "crates/lt-tauri",
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/hydai/murmur"
homepage = "https://github.com/hydai/murmur"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
thiserror = "2.0.20"
async-trait = "0.1.92"
tracing = "0.1.44"
directories = "6.0.0"

# Each crate selects the features it needs on top of these; the version lives
# here so an upgrade cannot leave one manifest behind.
tokio = { version = "1.53.1" }
# Keeps its default TLS stack; only the extra features differ per crate.
reqwest = { version = "0.13.4" }
tempfile = "3.27.0"
tracing-subscriber = "0.3.23"
sys-locale = "0.3.2"
url = "2.5.8"
